name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Cloudflare secrets
        id: cloudflare
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$NOUS_BACKEND_ORIGIN_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped because CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, or NOUS_BACKEND_ORIGIN_URL is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOUS_BACKEND_ORIGIN_URL: ${{ secrets.NOUS_BACKEND_ORIGIN_URL }}

      - name: Install Wrangler
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm install

      - name: Stage static site
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm run site:stage

      - name: Configure backend origin secret
        if: steps.cloudflare.outputs.configured == 'true'
        run: printf '%s' "$NOUS_BACKEND_ORIGIN_URL" | npx wrangler secret put NOUS_BACKEND_ORIGIN_URL
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOUS_BACKEND_ORIGIN_URL: ${{ secrets.NOUS_BACKEND_ORIGIN_URL }}

      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
