name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          python -m pip install -e .
          NOUS_OS_HOME="${RUNNER_TEMP}/nous-os" python -m unittest discover -s tests -v
          git diff --exit-code
