name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p _site/docs _site/demo _site/examples/runtime/research-records
          cp index.html _site/
          cp about.html _site/
          cp research.html _site/
          cp research-line.html _site/
          mkdir -p _site/docs/research-line/inbound _site/docs/research-line/preregistration _site/docs/research-line/synthesis
          cp docs/research-line/*.md _site/docs/research-line/ 2>/dev/null || true
          cp favicon.svg _site/
          cp CNAME _site/
          cp .nojekyll _site/
          cp README.md _site/
          cp ARCHITECTURE.md _site/
          cp docs/*.md _site/docs/
          cp -R docs/harness _site/docs/
          cp demo/heartbeat-dashboard.html _site/demo/
          cp demo/student-sandbox-v1.html _site/demo/
          cp demo/student-sandbox-v1-guide.html _site/demo/
          cp demo/student-session-review.html _site/demo/
          cp -R demo/assets _site/demo/
          cp examples/runtime/dashboard-data.json _site/examples/runtime/
          cp examples/runtime/research-records/latest.json _site/examples/runtime/research-records/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
