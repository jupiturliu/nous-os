name: Live Interface smoke

on:
  schedule:
    - cron: "45 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-interface-smoke
  cancel-in-progress: true

jobs:
  synthetic-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install .

      - name: Exercise configured external Interfaces with synthetic data
        env:
          NOUS_OS_RESEARCH_NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOUS_OS_RESEARCH_NOTIFICATION_WEBHOOK_URL }}
          HERMES_API_SERVER_URL: ${{ vars.HERMES_API_SERVER_URL }}
          HERMES_API_SERVER_KEY: ${{ secrets.HERMES_API_SERVER_KEY }}
        run: python -m nous_os.scenarios.live
