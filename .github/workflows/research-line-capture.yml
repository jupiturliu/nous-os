name: Research Line · L1 daily capture

on:
  schedule:
    # 07:15 UTC daily = early morning Pacific. Single window per day.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Override --max-age-days (default 2)"
        required: false
        default: "2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-line-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run capture script
        id: capture
        run: |
          set -euo pipefail
          python -m pip install -e .
          MAX_AGE="${{ github.event.inputs.max_age_days || '2' }}"
          nous-os run research-line --profile research --max-age-days "$MAX_AGE"
          # Capture the dated filename for downstream steps.
          DATE_LABEL="$(date -u +%Y-%m-%d)"
          echo "date_label=${DATE_LABEL}" >> "$GITHUB_OUTPUT"
          INBOX_FILE="docs/research-line/inbound/_inbox/${DATE_LABEL}.md"
          echo "inbox_file=${INBOX_FILE}" >> "$GITHUB_OUTPUT"
          if [ ! -f "$INBOX_FILE" ]; then
            echo "::error::Capture script did not produce ${INBOX_FILE}"
            exit 1
          fi

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain ${{ steps.capture.outputs.inbox_file }})" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes from today's capture (file is byte-identical to existing)."
          fi

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_LABEL: ${{ steps.capture.outputs.date_label }}
          INBOX_FILE: ${{ steps.capture.outputs.inbox_file }}
        run: |
          set -euo pipefail

          BRANCH="research-line/inbox-${DATE_LABEL}"

          # Make sure we are not on top of a prior abandoned branch.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::Branch ${BRANCH} already exists on origin; updating."
          fi

          git config user.name  "nous-os-bot"
          git config user.email "noreply@nousos.ai"

          git checkout -b "$BRANCH"
          git add "$INBOX_FILE"
          git commit -m "L1 capture · ${DATE_LABEL}" \
            -m "Daily Research Line L1 capture produced by nous_os.workflows.research_line. Raw, keyword-filtered, awaiting L2 triage. Merge to publish into the inbox corpus; close to discard; transform an entry into a full inbound note via docs/research-line/inbound/_template.md before merging if it is worth keeping."

          git push --force-with-lease origin "$BRANCH"

          # Build the PR body in a temp file so the YAML run-block does not
          # have to embed a bash heredoc (which conflicts with YAML's `|`
          # indentation rules and prevents the workflow from registering).
          BODY_FILE="$(mktemp)"
          {
            printf 'Daily Research Line L1 capture.\n\n'
            printf '**File:** `%s`\n\n' "${INBOX_FILE}"
            printf '**Triage options:**\n'
            printf -- '- **Merge** → entry list is preserved in the inbox corpus (visible in repo, not deployed to the site by default).\n'
            printf -- '- **Close** → entire day discarded; no record kept.\n'
            printf -- '- **Transform first** → promote 1–3 entries to full inbound notes under `docs/research-line/inbound/` using the inbound `_template.md`. Update `docs/research-line/anchor-atlas.md` and `research-line-atlas.html` to flip the corresponding entry from `queued`/`scanned` to `note-written`. Then merge.\n\n'
            printf 'This PR was opened by `.github/workflows/research-line-capture.yml` on a daily cron. The bot does not auto-merge.\n'
          } > "$BODY_FILE"

          # Ensure the label exists before we try to attach it to the PR.
          # gh pr create --label fails outright if the label is absent, so
          # this step is required on first run and is a no-op after that.
          gh label create "research-line:inbox" \
            --color "7b61ff" \
            --description "L1 daily capture PR opened by the research-line-capture workflow" \
            2>/dev/null || true

          # Idempotent: if a PR already exists for this branch, reuse it.
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q "^0$"; then
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "L1 capture · ${DATE_LABEL}" \
              --body-file "$BODY_FILE" \
              --label "research-line:inbox"
          else
            echo "::notice::A PR already exists for branch ${BRANCH}; new commit pushed."
          fi

          rm -f "$BODY_FILE"
