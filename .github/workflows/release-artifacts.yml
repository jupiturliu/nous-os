name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup reference Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned build tools and source package
        run: |
          python -m pip install --requirement requirements/build.lock
          python -m pip install --editable .

      - name: Run canonical release Gate
        run: nous-os --runtime-home "${RUNNER_TEMP}/nous-os-release" check --mode release

      - name: Upload verified artifacts and provenance
        uses: actions/upload-artifact@v7
        with:
          name: nous-os-${{ github.sha }}
          path: ${{ runner.temp }}/nous-os-release/release/
          if-no-files-found: error
          retention-days: 30
