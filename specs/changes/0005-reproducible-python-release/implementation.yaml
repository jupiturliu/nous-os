compatibility:
  - Preserve `pip install -e .` and the existing `nous-os` console entry point for source development.
  - Preserve named and explicit-path Profile selection; named Profiles gain an installed-resource fallback only when no checkout file exists.
  - Preserve all existing CLI commands, JSON schemas, Evidence and Artifact formats, public routes, snapshots, and Spec lifecycle behavior.
  - Keep release mode keyless and leave CI, quick, and full Gate mode meanings unchanged.
migration:
  - Establish one canonical packaged Profile resource tree and make repository Profile files generated or checked mirrors so they cannot drift.
  - Add pinned build-only tooling separately from the runtime dependency declaration.
  - Replace the source-entry-only release Gate with normalized build, inspection, reproducibility, and isolated-install Gates.
  - Add dependency-update metadata and a checked third-party notice for the runtime closure.
rollback:
  - Restore release mode to the current source entry-path smoke and remove artifact-only Gates.
  - Restore named Profile resolution to repository config files while retaining explicit path selection.
  - Remove build/provenance Modules and the artifact workflow; no registry artifact needs deletion because publication is out of scope.
  - Restore the prior package-data configuration and dependency-update policy together.
residual_risks:
  - Reproducibility is established only for the declared Linux/Python 3.11 reference builder.
  - Workflow artifact retention and GitHub infrastructure are outside repository control.
  - Hash manifests prove artifact identity but not publisher identity or source authenticity without later signing.
  - License verification covers the declared runtime closure, not operating-system or hosted-runner components.
