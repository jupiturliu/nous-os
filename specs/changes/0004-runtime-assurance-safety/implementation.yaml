compatibility:
  - Preserve existing workflow, publication, validation, Spec, and check command behavior outside the new diagnose command and lifecycle failure detail.
  - Preserve Evidence Event, Artifact, Projection, Public Snapshot, notification payload, and existing public route response formats.
  - Preserve GET /api/health as liveness and add GET /api/ready without changing existing route meanings.
  - Continue keyless scenario replay and update only the reviewed Profile plugin-count snapshot fields required by explicit assurance Plugins.
migration:
  - Change shipped Profiles from schema_version 1 to 2 and add an explicit allowed_effects list containing only effects needed by their declared Plugins.
  - Add assurance, environment-credential, permission-policy, and disabled-telemetry Plugins to shipped Profiles in dependency-valid order.
  - Replace notification webhook_env configuration with webhook_ref using the same NOUS_OS_RESEARCH_NOTIFICATION_WEBHOOK_URL environment reference.
  - Make Profile v1 loading fail with a direct instruction to add allowed_effects and set schema_version 2.
rollback:
  - Revert shipped Profiles and loader to schema version 1 together with the Plugin effect contract.
  - Restore notification environment resolution inside its Plugin if the Credential Provider is removed.
  - Remove /api/ready and diagnose while preserving /api/health and existing commands.
  - Keep Evidence and Artifact files unchanged because this change introduces no durable format migration.
residual_risks:
  - Effect declarations are statically reviewed assertions and cannot detect every hidden side effect in arbitrary Python code.
  - Environment credential values remain protected by operating-system and deployment controls outside NOUS OS.
  - Disabled or local-only telemetry does not provide centralized alerting or delivery guarantees.
  - External Profile v1 files require a manual schema migration.
