    target: tests.test_scenario_replay
  - id: profile-validation
    kind: profiles
  - id: full-test-suite
    kind: unittest
    target: discover:tests
compatibility:
  - Preserve all existing nous-os command names, arguments, output contracts, and exit behavior outside the new check command.
  - Preserve Profile schema version 1 and existing Plugin composition.
  - Preserve Evidence Event, Artifact, Projection, Public Snapshot, and public HTTP route formats.
  - Keep existing Software Change commit and push gates effective while CI delegates verification checks to the Gate Module.
migration:
  - Add the new check command without changing existing commands.
  - Replace duplicated CI validation and unit-test steps with one invocation of nous-os check --mode ci after equivalence tests pass.
  - Record the initial privacy-safe snapshots through the explicit scenario recording Interface and review them before commit.
rollback:
  - Restore explicit CI validation and unittest commands while retaining the standalone tests.
  - Remove the new check and scenario Modules and their snapshots; existing Harness commands remain independently runnable.
residual_risks:
  - Offline replay cannot prove availability or behavior of an external provider.
  - Optional live checks do not block pull requests and may be skipped when credentials are absent.
  - Snapshot review remains a human responsibility when intentionally visible behavior changes.
