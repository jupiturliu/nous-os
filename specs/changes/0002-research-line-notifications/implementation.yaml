compatibility:
  - Preserve the existing nous-os run research-line arguments and successful output-file behavior.
  - Preserve Research Line feed parsing, filtering, markdown format, and scheduled pull-request flow.
  - Preserve existing Profile loading and public HTTP route Interfaces.
migration:
  - Add the Notification Plugin to the research Profile with webhook delivery disabled when its environment secret is absent.
  - Configure NOUS_OS_RESEARCH_NOTIFICATION_WEBHOOK_URL in each environment that should deliver notifications.
rollback:
  - Remove the Notification Plugin from the research Profile; Research Line capture remains independently runnable.
  - Remove the webhook secret to disable external delivery without changing code or tracked configuration.
residual_risks:
  - Best-effort notification delivery is not durable and does not retry.
  - The webhook provider observes capture date and completion status.
  - Duplicate manual or scheduled captures can produce duplicate notifications.
