schema_version: 1
name: research
plugins:
  - id: evidence
    module: nous_os.plugins.evidence
  - id: notifications
    module: nous_os.plugins.notifications
    config:
      webhook_env: NOUS_OS_RESEARCH_NOTIFICATION_WEBHOOK_URL
      timeout_seconds: 5
  - id: research-line
    module: nous_os.plugins.research_line
  - id: heartbeat
    module: nous_os.plugins.heartbeat
workflows:
  - research-line
  - heartbeat
web:
  host: 127.0.0.1
  port: 8787
